image: "haskell:8.6.5"

before_script:
  - locale
  - stack --version

variables:
  LANG: "C.UTF-8"
  LC_ALL: "C.UTF-8"
  STACK_ROOT: "${CI_PROJECT_DIR}/.stack-root"

stages:
  - haskell_build
  - site_build
  - test
  - deploy

build_haskell:
  stage: haskell_build
  tags: 
    - docker1
  before_script:
    - locale
    - stack --version
    - stack setup --system-ghc
    - stack install --system-ghc --only-dependencies
  script:
    - stack install --system-ghc --local-bin-path ./bin
    - du -hcs .stack-work/ .stack-root/ || true
  artifacts:
    paths:
      - ./bin
    expire_in: 1 week
  cache:
    key: "${CI_COMMIT_REF_SLUG}-haskell_build"
    paths:
      - .stack-root/

build_site:
  stage: site_build
  tags:
    - docker1
  needs:
    - job: "build_haskell"
      artifacts: true
  artifacts:
    paths:
      - _cache/
      - _site/
    expire_in: 1 week
  script:
    - ./bin/site build
  cache: {}

check_links:
    stage: test
    tags:
      - docker1
    needs:
      - job: "build_haskell"
        artifacts: true
      - job: "build_site"
        artifacts: true
    script:
      - ./bin/site check
    retry: 2 # job is susceptible to network failure, retry up to two times on failure
    allow_failure: true
    cache: {}

.deploy:
  stage: deploy
  tags:
    - docker1
  needs:
    - job: "build_site"
      artifacts: true
  script:
    - mkdir .public
    - cp -r _site/* .public
    - mv .public public
  artifacts:
    paths:
      - public
    expire_in: 1 week
  cache: {}

create_archive:
  extends: .deploy
  except:
    - hakyll

pages:
  extends: .deploy
  only:
      - hakyll
